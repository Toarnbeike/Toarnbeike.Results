name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '10.0.x'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run XUnit Tests (Results.Abstractions)
        run: dotnet test tests/Results.Abstractions.Tests/Results.Abstractions.Tests.csproj --framework net10.0 --configuration Release --no-build --verbosity normal

      - name: Run TUnit Tests
        run: |
          set +e

          mkdir -p artifacts/tunit
          FAILED=0

          projects=(
            "tests/Results.Tests/Results.Tests.csproj"
            "tests/Results.FluentValidation.Tests/Results.FluentValidation.Tests.csproj"
            "tests/Results.MinimalApi.Tests/Results.MinimalApi.Tests.csproj"
            "tests/Results.Ensure.Tests/Results.Ensure.Tests.csproj"
          )

          for project in "${projects[@]}"; do
            name=$(basename "$(dirname "$project")")
            log="artifacts/tunit/$name.log"

            echo "=============================="
            echo "Running tests for $name"
            echo "=============================="

            dotnet run \
              --project "$project" \
              --configuration Release \
              | tee "$log"

            EXIT_CODE=${PIPESTATUS[0]}

            if [ $EXIT_CODE -ne 0 ]; then
              echo "Tests failed for $name"
              FAILED=1
            else
              echo "Tests passed for $name"
            fi
          done

          exit $FAILED

      - name: Upload XUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-results
          path: tests/Results.Abstractions.Tests/TestResults/*.trx

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunit-output
          path: artifacts/tunit/*.log